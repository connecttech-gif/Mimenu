<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardapio Digital</title>
  <meta name="description" content="Cardapio digital online">

  <link rel="icon" id="favicon" href="">

  <link rel="stylesheet" href="css/variaveis.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/temas/classico.css" id="tema-css">
</head>
<body>

  <div id="tela-carregando" class="tela-carregando">
    <div class="spinner"></div>
  </div>

  <div id="tela-erro" class="tela-erro oculto">
    <div class="tela-erro__conteudo">
      <h1>Cardapio nao encontrado</h1>
      <p id="tela-erro__mensagem">Verifique o endereco e tente novamente.</p>
    </div>
  </div>

  <div id="tela-cliente" class="tela-cliente oculto">
    <div class="tela-cliente__cabecalho">
      <button class="tela-cliente__voltar" id="botao-fechar-cliente">← Voltar</button>
      <h2 class="tela-cliente__titulo">Minha conta</h2>
    </div>

    <div class="tela-cliente__abas">
      <button class="tela-cliente__aba ativo" data-aba-cliente="dados">Meus dados</button>
      <button class="tela-cliente__aba" data-aba-cliente="pedidos">Meus pedidos</button>
    </div>

    <div class="tela-cliente__conteudo">
      <div id="aba-cliente-dados" class="aba-cliente">
        <form id="form-dados-cliente" class="tela-cliente__form">
          <label>Nome completo
            <input type="text" id="dados-nome" maxlength="150">
          </label>
          <label>WhatsApp / Telefone
            <input type="tel" id="dados-telefone" maxlength="20">
          </label>
          <label>Endereco de entrega
            <textarea id="dados-endereco" maxlength="300"></textarea>
          </label>
          <button type="submit" class="botao-primario">Salvar dados</button>
        </form>
        <a id="link-whatsapp-menu" class="tela-cliente__whatsapp" href="#" target="_blank" rel="noopener">💬 Falar no WhatsApp</a>
      </div>

      <div id="aba-cliente-pedidos" class="aba-cliente oculto">
        <div id="lista-pedidos-cliente"></div>
      </div>
    </div>
  </div>

  <div id="app" class="oculto">

    <header class="topo">
      <div class="topo__banner" id="topo-banner"></div>
      <div class="topo__identidade">
        <img id="logo-estabelecimento" class="topo__logo" src="" alt="Logo">
        <h1 id="nome-estabelecimento" class="topo__nome"></h1>
      </div>
    </header>

    <button id="botao-menu-cliente" class="menu-cliente__botao" aria-label="Minha conta">👤</button>

    <section class="apresentacao">
      <p id="texto-apresentacao" class="apresentacao__texto"></p>
      <div id="status-funcionamento" class="apresentacao__status"></div>
    </section>

    <section id="secao-promocoes" class="promocoes oculto">
      <h2 class="secao-titulo">Promocoes</h2>
      <div id="lista-promocoes" class="promocoes__lista"></div>
    </section>

    <section class="categorias">
      <h2 class="secao-
